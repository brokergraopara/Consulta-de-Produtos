<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef3fc; --surface: #fff; --text: #222; --muted: #666;
    --line: #e4e4e4; --accent: #0078D7; --ph: #e9edf2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16181c; --surface: #20242a; --text: #eceff3; --muted: #9aa3ad;
            --line: #323842; --accent: #4aa3ff; --ph: #2a3038; }
  }
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: var(--bg); color: var(--text); }
  :root { --royal: #4169E1; --onda-base: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 40' preserveAspectRatio='none'><path d='M0,20 C240,40 480,0 720,20 C960,40 1200,0 1440,20 L1440,40 L0,40 Z'/></svg>");
          --onda-topo: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1440 40' preserveAspectRatio='none'><path d='M0,0 L1440,0 L1440,20 C1200,40 960,0 720,20 C480,40 240,0 0,20 Z'/></svg>"); }

  header { position: relative; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 20px;
           margin: -15px -15px 10px; padding: 24px 28px 64px; background: var(--royal); color: #fff; }
  header::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 40px;
                  background: var(--bg); -webkit-mask: var(--onda-base) bottom / 100% 100% no-repeat;
                  mask: var(--onda-base) bottom / 100% 100% no-repeat; }
  header img { height: 84px; width: auto; max-width: 280px; object-fit: contain; background: #fff;
               padding: 10px 16px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
  header h2 { grid-column: 2; transform: translateY(-12px); }
  @media (max-width: 700px) {
    header { grid-template-columns: 1fr; }
    header h2 { grid-column: 1; transform: none; }
  }
  h2 { margin: 0; font-size: clamp(22px, 4vw, 32px); text-align: center;
       font-family: "Nunito", "Arial Rounded MT Bold", Arial, sans-serif; font-weight: 800; }

  .rodape { position: relative; height: 72px; margin: 40px -15px -15px; background: var(--royal); }
  .rodape::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 40px;
                    background: var(--bg); -webkit-mask: var(--onda-topo) top / 100% 100% no-repeat;
                    mask: var(--onda-topo) top / 100% 100% no-repeat; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; margin: 14px 0; }
  .toolbar input, .toolbar select {
    padding: 10px; border: 1px solid var(--line); border-radius: 8px; font-size: 16px;
    background: var(--surface); color: var(--text);
  }
  .toolbar input { flex: 1; min-width: 220px; max-width: 400px; }
  #contador { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 12px; }

  #grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
          display: flex; flex-direction: column; }
  .foto { aspect-ratio: 1 / 1; background: var(--ph); display: flex; align-items: center; justify-content: center;
          cursor: zoom-in; border: 0; padding: 0; width: 100%; }
  .foto img { width: 100%; height: 100%; object-fit: contain; }
  .foto.sem { cursor: default; color: var(--muted); font-size: 13px; }
  .foto { position: relative; }
  .badge { position: absolute; right: 6px; bottom: 6px; background: rgba(0,0,0,.65); color: #fff;
           font-size: 11px; padding: 2px 7px; border-radius: 10px; }
  #miniaturas { display: flex; gap: 8px; justify-content: center; padding: 10px 16px 0; }
  #miniaturas:empty { display: none; }
  #miniaturas button { width: 56px; height: 56px; padding: 0; border: 2px solid var(--line); border-radius: 6px;
                       background: var(--ph); cursor: pointer; overflow: hidden; }
  #miniaturas button:hover { border-color: var(--accent); }
  #miniaturas img { width: 100%; height: 100%; object-fit: cover; max-height: none; }
  .info { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .sku { font-weight: bold; color: var(--accent); font-size: 14px; }
  .desc { font-size: 14px; line-height: 1.3; }
  .meta { font-size: 12px; color: var(--muted); }

  #mais { display: block; margin: 20px auto; padding: 10px 22px; font-size: 15px; border: 0; border-radius: 8px;
          background: var(--accent); color: #fff; cursor: pointer; }
  #mais[hidden] { display: none; }

  dialog { border: 0; border-radius: 10px; padding: 0; max-width: min(92vw, 720px); background: var(--surface); color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.6); }
  dialog img { display: block; max-width: 100%; max-height: 70vh; margin: 0 auto; }
  dialog .legenda { padding: 12px 16px 16px; font-size: 14px; }
  dialog { width: min(92vw, 720px); }
  dialog #zoomImg { width: 100%; min-height: 160px; object-fit: contain; }
  #fechar { position: absolute; top: 8px; right: 8px; border: 0; border-radius: 50%; width: 34px; height: 34px;
                  font-size: 20px; cursor: pointer; background: rgba(0,0,0,.6); color: #fff; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
  <header>
    <img src="logo.png?v=2" alt="Logo da Empresa">
    <h2>Consulta de Produtos</h2>
  </header>

  <div class="toolbar">
    <input type="search" id="busca" placeholder="Digite SKU, descrição ou EAN" aria-label="Buscar produto">
    <select id="filtroGrupo" aria-label="Filtrar por grupo"><option value="">Todos os grupos</option></select>
  </div>
  <div id="contador" aria-live="polite"></div>

  <div id="grade"></div>
  <button id="mais" hidden>Mostrar mais</button>

  <div class="rodape" aria-hidden="true"></div>

  <dialog id="zoom">
    <button id="fechar" aria-label="Fechar">×</button>
    <img id="zoomImg" alt="" referrerpolicy="no-referrer">
    <div id="miniaturas"></div>
    <div class="legenda" id="zoomLegenda"></div>
  </dialog>

<script>
  /* As imagens vêm do produtos.csv: coluna F = img1, coluna G = img2 (URLs completas). */
  const POR_PAGINA = 60;

  let produtos = [], filtrados = [], exibidos = 0;
  const grade = document.getElementById('grade');
  const busca = document.getElementById('busca');
  const selGrupo = document.getElementById('filtroGrupo');
  const btnMais = document.getElementById('mais');
  const contador = document.getElementById('contador');
  const zoom = document.getElementById('zoom');

  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');

  // Lê o CSV como UTF-8; se vier com caracteres quebrados (export do ERP), usa Windows-1252
  fetch('produtos.csv')
    .then(r => r.arrayBuffer())
    .then(buf => {
      let texto = new TextDecoder('utf-8').decode(buf);
      if (texto.includes('\uFFFD')) texto = new TextDecoder('windows-1252').decode(buf);
      const linhas = texto.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      produtos = linhas.slice(1).map(l => {
        const p = l.split(';');
        const o = { sku: (p[0]||'').trim(), descricao: (p[1]||'').trim(),
                    familia: (p[2]||'').trim(), grupo: (p[3]||'').trim(), ean: (p[4]||'').trim() };
        o.imgs = [(p[5]||'').trim(), (p[6]||'').trim()].filter(u => /^(https?:)?\/\//i.test(u) || /^[\w./-]+\.(jpe?g|png|webp|gif)/i.test(u));
        o.chave = norm(`${o.sku} ${o.descricao} ${o.ean}`);
        return o;
      });
      [...new Set(produtos.map(p => p.grupo).filter(Boolean))].sort((a,b) => a.localeCompare(b, 'pt-BR'))
        .forEach(g => selGrupo.add(new Option(g, g)));
      filtrar();
    })
    .catch(() => { contador.textContent = 'Não foi possível carregar produtos.csv'; });

  function filtrar() {
    const termo = norm(busca.value.trim());
    const grupo = selGrupo.value;
    filtrados = produtos.filter(p => (!grupo || p.grupo === grupo) && (!termo || p.chave.includes(termo)));
    grade.innerHTML = '';
    exibidos = 0;
    contador.textContent = `${filtrados.length} produto(s)`;
    maisCards();
  }

  function maisCards() {
    const frag = document.createDocumentFragment();
    filtrados.slice(exibidos, exibidos + POR_PAGINA).forEach(p => frag.appendChild(criarCard(p)));
    grade.appendChild(frag);
    exibidos = Math.min(exibidos + POR_PAGINA, filtrados.length);
    btnMais.hidden = exibidos >= filtrados.length;
  }

  function criarCard(p) {
    const card = document.createElement('article');
    card.className = 'card';
    card.innerHTML = `
      <button class="foto sem" type="button" aria-label="Ampliar foto de ${esc(p.descricao)}"></button>
      <div class="info">
        <span class="sku">${esc(p.sku)}</span>
        <span class="desc">${esc(p.descricao)}</span>
        <span class="meta">${esc([p.familia, p.grupo].filter(Boolean).join(' • '))}</span>
        <span class="meta">${p.ean ? 'EAN ' + esc(p.ean) : ''}</span>
      </div>`;
    const foto = card.querySelector('.foto');
    // Testa img1 e img2; usa só as que carregam. O selo "2 fotos" só aparece se as duas funcionarem.
    validar(p.imgs, ok => {
      if (!ok.length) { foto.textContent = 'Sem foto'; foto.disabled = true; return; }
      foto.classList.remove('sem');
      foto.innerHTML = `<img src="${esc(ok[0])}" alt="${esc(p.descricao)}" referrerpolicy="no-referrer">` +
        (ok.length > 1 ? '<span class="badge">2 fotos</span>' : '');
      foto.onclick = () => abrirZoom(p, ok);
    });
    return card;
  }

  function validar(lista, cb) {
    const res = new Array(lista.length).fill(null);
    let pend = lista.length;
    if (!pend) return cb([]);
    lista.forEach((u, i) => {
      const im = new Image();
      im.referrerPolicy = 'no-referrer';
      const fim = ok => { res[i] = ok ? u : null; if (--pend === 0) cb(res.filter(Boolean)); };
      im.onload = () => fim(true);
      im.onerror = () => fim(false);
      im.src = u;
    });
  }

  function abrirZoom(p, ok) {
    const zi = document.getElementById('zoomImg');
    zi.src = ok[0];
    zi.alt = p.descricao;
    document.getElementById('zoomLegenda').textContent = `${p.sku} — ${p.descricao}`;
    const mini = document.getElementById('miniaturas');
    mini.innerHTML = '';
    if (ok.length > 1) {
      ok.forEach((u, n) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.setAttribute('aria-label', `Ver foto ${n + 1}`);
        b.innerHTML = `<img src="${esc(u)}" alt="" referrerpolicy="no-referrer">`;
        b.onclick = () => { zi.src = u; };
        mini.appendChild(b);
      });
    }
    zoom.showModal();
  }

  busca.addEventListener('input', filtrar);
  selGrupo.addEventListener('change', filtrar);
  btnMais.addEventListener('click', maisCards);
  document.getElementById('fechar').addEventListener('click', () => zoom.close());
  zoom.addEventListener('click', e => { if (e.target === zoom) zoom.close(); });
</script>
</body>
</html>
